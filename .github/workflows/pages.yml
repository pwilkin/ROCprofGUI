name: Deploy documentation to GitHub Pages

# Builds the self-contained VitePress site in website/ and publishes it with
# the official GitHub Pages actions. This only publishes documentation; it does
# not build or change the rocprof-studio application.
#
# One-time setup by a human: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Until that is set, the deploy step has nowhere to
# publish.
#
# Base path: the site is served from https://<owner>.github.io/<repo>/, so the
# base must be "/<repo>/". DOCS_BASE below defaults to the repository name via
# ${{ github.event.repository.name }}. If you serve from a user/org root or a
# custom domain, set DOCS_BASE to "/" instead.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci || npm install
      - name: Build site
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
